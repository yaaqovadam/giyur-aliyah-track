<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A192F" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="shortcut icon" href="/favicon.ico">

  <title>Page Not Found — Giyur Aliyah Track</title>
  <style>
    html, body {
      overflow-x: clip !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0;
      padding: 0;
      background: #0A192F;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    h1 { font-size: 1.5rem; margin: 0 0 10px; color: #FFFFFF; }
    p { font-size: 0.95rem; line-height: 1.55; color: #94A3B8; margin: 0 0 24px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0A96FA 0%, #0277D0 100%);
      color: #FFFFFF;
      font-weight: 700;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 12px;
      margin: 6px;
      font-size: 0.95rem;
    }
    .btn-sec {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
    }
  </style>
</head>
<body>
  <div class="card">

</html>
